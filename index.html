<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iilliaa</title>
<meta name="description" content="iilliaa makes music. Website coming soon.">
<meta property="og:title" content="iilliaa">
<meta property="og:description" content="I make music. Website coming soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23f2f2f2' font-family='Arial,sans-serif'>i</text></svg>">
<style>
  :root { --bg: #0a0a0a; --fg: #f2f2f2; --dim: #8a8a8a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 7vw;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; }
  .intro { font-size: clamp(15px, 1.6vw, 17px); line-height: 1.6; color: var(--dim); }
  .intro p:first-child { color: var(--fg); }
  h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 12vw, 112px);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 9vh 0 5vh;
  }
  ul { list-style: none; font-size: clamp(17px, 2vw, 20px); line-height: 2; }
  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .2s, color .2s;
  }
  a:hover, a:focus-visible { border-bottom-color: var(--fg); outline: none; }
  ul span { color: var(--dim); }
  footer { margin-top: 9vh; color: var(--dim); font-size: 15px; }
  footer .mail { margin-top: 6px; }
  footer .mail a { color: var(--dim); }
  footer .mail a:hover, footer .mail a:focus-visible { color: var(--fg); border-bottom-color: var(--fg); }
  main > * { opacity: 0; animation: in .9s ease forwards; }
  main > *:nth-child(2) { animation-delay: .15s; }
  main > *:nth-child(3) { animation-delay: .3s; }
  main > *:nth-child(4) { animation-delay: .45s; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main > * { animation: none; opacity: 1; } }
</style>
</head>
<body>
<main>
  <div class="intro">
    <p>I make music</p>
    <p>Website coming soon</p>
  </div>

  <h1>iilliaa</h1>

  <ul>
    <li><span>on</span> <a href="https://open.spotify.com/artist/3XDX6PbRtAzovlF2DnoT5F" target="_blank" rel="noopener">Spotify</a></li>
    <li><span>on</span> <a href="https://music.apple.com/artist/iilliaa/1711046844" target="_blank" rel="noopener">Apple Music</a></li>
    <li><span>on</span> <a href="https://music.youtube.com/@iilliaa" target="_blank" rel="noopener">YouTube</a></li>
    <li><span>on</span> <a href="https://www.google.com/search?q=iilliaa+music" target="_blank" rel="noopener">everything else</a></li>
  </ul>

  <footer>
    <p>Take care.</p>
    <p class="mail"><a href="mailto:contact@iilliaa.com">contact@iilliaa.com</a></p>
  </footer>
</main>
</body>
</html>
